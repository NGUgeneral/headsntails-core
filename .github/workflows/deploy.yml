name: Continuous Integration (headsntails-core)

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  # --- STAGE 1: VERIFICATION GATE (Runs on BOTH PRs and Merge to Main) ---
  validate:
    name: Build Verification & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.3' # Matches your explicit platform specification

    - name: Run Unit Tests with Race Detection
      run: |
        go test -v -race ./...

  # --- STAGE 2: PACKAGING GATE (Runs ONLY after a successful merge to Main) ---
  package:
    name: Build & Publish Production Container
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Test Local Docker Build
      run: |
        docker build -t headsntails-core:latest .